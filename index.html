    <script>

            theme: {
                extend: {
                    colors: {
                        golf: {
                            dark: '#0B422B', light: '#146845', gold: '#D4AF37',

    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #F5F7FA; }
        .hero-pattern {
            background-color: #0B422B;
            background-image: radial-gradient(#146845 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* 高尔夫球抛物线动画 */
        .gball-track {
            position: absolute;
            left: 24px;
            bottom: 24px;
            animation: gball-x 2.8s cubic-bezier(0.3, 0, 0.7, 1) 0.6s both;
        }
        @keyframes gball-x {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(100vw - 72px)); }
        }
        .gball-arc {
            animation: gball-y 2.8s ease-in-out 0.6s both;
        }
        @keyframes gball-y {
            0%   { transform: translateY(0); }
            45%  { transform: translateY(-130px); }
            100% { transform: translateY(0); }
        }
        .gball {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 38% 32%, #ffffff 0%, #e2e2e2 60%, #bdbdbd 100%);
            border-radius: 50%;
            box-shadow: 1px 2px 8px rgba(0,0,0,0.55);
            animation: gball-spin 2.8s linear 0.6s both;
        }
        @keyframes gball-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(600deg); }
        }
    </style>

                            </li>
                            <!-- 第三名 -->
                            <li class="flex items-start rounded-lg p-2">
                                <span class="mt-0.5 w-6 h-6 shrink-0 rounded-full bg-golf-bronze text-white flex items-center justify-center text-xs font-bold mr-3 shadow-sm">3</span>
                                <div>
                                    <h4 class="font-semibold text-gray-800 leading-none">${item.third}<span class="ml-1.5 text-xs font-bold text-gray-600">${EN_NAMES[item.third] || ''}</span></h4>
                                    <p class="text-xs text-gray-500 mt-1.5 leading-snug">${item.desc3}</p>
                                </div>
                            </li>
                        </ul>
                    </div>
                `;
                grid.appendChild(card);
            });

            section.innerHTML = titleHtml;
            section.appendChild(grid);
            app.appendChild(section);
        });
    </script>
</body>
</html>
