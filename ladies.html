                      second: "查莉·赫尔",       desc2: "在美国女子公开赛决赛轮交出精彩的67杆，以微弱差距屈居亚军，展现了极强的大满贯竞争力。",
                      third:  "阿塔雅·提提库",   desc3: "延续去年破纪录的极佳手感，在本赛季前半程依然稳居世界前列与积分榜头部。" }
                ]
            }
        ];

        const app = document.getElementById('app');

        data.forEach(period => {
            const section = document.createElement('div');
            section.className = "mb-16";

            const titleHtml = `
                <div class="flex items-center mb-8">
                    <h2 class="text-3xl font-bold text-golf-dark drop-shadow-sm">${period.era}</h2>
                    <div class="flex-grow ml-4 h-px bg-gray-300"></div>
                </div>
            `;

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8";

            period.years.forEach(item => {
                const imgUrl = IMAGES[item.first] || IMAGES["default"];
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-md overflow-hidden transform transition duration-300 hover:scale-[1.02] hover:shadow-xl flex flex-col";

                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden shrink-0">
                        <img src="${imgUrl}" alt="${item.first}" class="w-full h-full object-cover object-[center_15%]" onerror="this.src='${IMAGES["default"]}'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div class="absolute bottom-4 left-4">
                            <span class="bg-golf-gold text-white text-xs tracking-wider font-bold px-3 py-1 rounded-full shadow">${item.year} 年</span>
                        </div>
                    </div>

                    <div class="p-5 flex-grow flex flex-col">
                        <ul class="space-y-4">
                            <!-- 第一名 -->
                            <li class="flex items-start bg-yellow-50/50 rounded-lg p-3 border border-yellow-100">
                                <span class="mt-0.5 w-6 h-6 shrink-0 rounded-full bg-golf-gold text-white flex items-center justify-center text-xs font-bold mr-3 shadow-sm">1</span>
                                <div>
                                    <h4 class="font-bold text-gray-900 text-lg leading-none">${item.first}<span class="ml-1.5 text-sm font-bold text-gray-600">${EN_NAMES[item.first] || ''}</span></h4>
                                    <p class="text-sm text-gray-600 mt-2 leading-snug">${item.desc1}</p>
                                </div>
                            </li>
                            <!-- 第二名 -->
                            <li class="flex items-start rounded-lg p-2">
                                <span class="mt-0.5 w-6 h-6 shrink-0 rounded-full bg-golf-silver text-white flex items-center justify-center text-xs font-bold mr-3 shadow-sm">2</span>
                                <div>
                                    <h4 class="font-semibold text-gray-800 leading-none">${item.second}<span class="ml-1.5 text-xs font-bold text-gray-600">${EN_NAMES[item.second] || ''}</span></h4>
                                    <p class="text-xs text-gray-500 mt-1.5 leading-snug">${item.desc2}</p>
                                </div>
                            </li>
                            <!-- 第三名 -->
                            <li class="flex items-start rounded-lg p-2">
                                <span class="mt-0.5 w-6 h-6 shrink-0 rounded-full bg-golf-bronze text-white flex items-center justify-center text-xs font-bold mr-3 shadow-sm">3</span>
                                <div>
                                    <h4 class="font-semibold text-gray-800 leading-none">${item.third}<span class="ml-1.5 text-xs font-bold text-gray-600">${EN_NAMES[item.third] || ''}</span></h4>
                                    <p class="text-xs text-gray-500 mt-1.5 leading-snug">${item.desc3}</p>
                                </div>
                            </li>
                        </ul>
                    </div>
                `;
                grid.appendChild(card);
            });

            section.innerHTML = titleHtml;
            section.appendChild(grid);
            app.appendChild(section);
        });
    </script>
</body>
</html>
